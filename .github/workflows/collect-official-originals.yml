name: Collect official classical originals (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Fetch permitted official archival URLs
        run: python scripts/collect_official_originals.py
      - name: Upload collection and diagnostics (does not auto-commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-originals-provisional
          path: research/primary_originals/
          if-no-files-found: warn
